version: '3.8'\n\nservices:\n  db:\n    image: postgres:15\n    environment:\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: postgres\n      POSTGRES_DB: ai_video_studio\n    ports:\n      - '5432:5432'\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\n  redis:\n    image: redis:7\n    ports:\n      - '6379:6379'\n\n  backend:\n    build: ./backend\n    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload\n    volumes:\n      - ./backend:/app\n    ports:\n      - '8000:8000'\n    depends_on:\n      - db\n      - redis\n    env_file:\n      - .env\n\n  workers:\n    build: ./workers\n    command: celery -A app.workers.celery worker --loglevel=info\n    volumes:\n      - ./backend:/app\n    depends_on:\n      - db\n      - redis\n    env_file:\n      - .env\n\n  frontend:\n    build: ./frontend\n    command: npm run dev\n    volumes:\n      - ./frontend:/app\n      - /app/node_modules\n      - /app/.next\n    ports:\n      - '3000:3000'\n    depends_on:\n      - backend\n\nvolumes:\n  postgres_data:\n
